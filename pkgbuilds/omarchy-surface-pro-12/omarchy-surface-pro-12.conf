# limine-entry-tool v1.38.0 loads /etc/default/limine last.  Its cmdline
# parser preserves += values. mkinitcpio 41 delegates UKI section assembly to
# ukify, whose [UKI] DeviceTree= setting embeds the fixed .dtb.
# The fixed, package-owned DTB deliberately replaces automatic HWID selection.
ENABLE_UKI=yes
CUSTOM_UKI_NAME=omarchy
MKINITCPIO_UKI_OPTIONS="--ukiconfig /etc/kernel/uki-surface-pro-12.conf"
MKINITCPIO_FALLBACK=yes
KERNEL_CMDLINE[default]+="initramfs_async=0 clk_ignore_unused pd_ignore_unused arm64.nopauth"
